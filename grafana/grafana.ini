[server]
root_url = http://localhost:3001

[auth]
disable_login_form = false

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = grafana
client_secret = $__env{KEYCLOAK_CLIENT_SECRET}
scopes = openid profile email
use_pkce = true

; The browser talks to Keycloak on localhost, Grafana's container talks to it as "keycloak".
auth_url = http://localhost:8080/realms/simple/protocol/openid-connect/auth
token_url = http://keycloak:8080/realms/simple/protocol/openid-connect/token
api_url = http://keycloak:8080/realms/simple/protocol/openid-connect/userinfo

login_attribute_path = preferred_username
email_attribute_path = email
name_attribute_path = name
email_attribute_path = preferred_username

; Role names come from your users' access_level (see the note below)
role_attribute_path = contains(roles[*], 'manager') && 'Admin' || contains(roles[*], 'power_user') && 'Editor' || 'Viewer'
role_attribute_strict = false

signout_redirect_url = http://localhost:8080/realms/simple/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3001%2Flogin

